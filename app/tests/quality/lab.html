<!doctype html>
<html>
<head>
<title>NitroVideo</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Quadro n é função só de n: o teste regenera exatamente o quadro que foi capturado.
// Conteúdo: foto detalhada panorâmica (movimento + textura), caixa de texto miúdo rolando
// (nitidez) e código de barras com n (24 bits) no canto.
const params = new URLSearchParams(location.hash.slice(1));
const W = Number(params.get("w")) || innerWidth;
const H = Number(params.get("h")) || innerHeight;
const c = document.getElementById("c");
c.width = W;
c.height = H;
const g0 = c.getContext("2d");
window.__g = g0;
const img = new Image();
img.src = "labbg.png";
const LINES = [];
let seed = 12345;
const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
const words = "const room await peer track sender encoder bitrate frame screen audio opus vp9 relay bridge score gossip latency jitter".split(" ");
for (let i = 0; i < 400; i++) {
  let s = `${String(i).padStart(3, "0")}  `;
  while (s.length < 70) s += words[Math.floor(rnd() * words.length)] + (rnd() < 0.3 ? "(" + Math.floor(rnd() * 999) + ") " : " ");
  LINES.push(s);
}
const BAR = 24, BITS = 24;
function render(n, g = window.__g) {
  // Fundo: a foto 1,35x maior, andando 4 px por quadro (vai e volta).
  const bw = W * 1.35, bh = H * 1.35;
  const span = bw - W;
  const t = (n * 4) % (2 * span);
  const x = t < span ? -t : -(2 * span - t);
  const y = -((n * 1.5) % (bh - H));
  g.drawImage(img, x, y, bw, bh);
  // Caixa de texto (como um editor/terminal rolando 1 linha a cada 2 quadros).
  const bx = Math.round(W * 0.52), by = Math.round(H * 0.08), bwid = Math.round(W * 0.44), bht = Math.round(H * 0.5);
  g.fillStyle = "#11141c";
  g.fillRect(bx, by, bwid, bht);
  g.font = "14px Consolas, monospace";
  g.fillStyle = "#d7e0ff";
  const first = Math.floor(n / 2);
  for (let i = 0; i < Math.floor(bht / 17) - 1; i++) g.fillText(LINES[(first + i) % LINES.length], bx + 10, by + 20 + i * 17);
  // Código de barras de n.
  g.fillStyle = "#808080";
  g.fillRect(0, 0, BAR * (BITS + 2), BAR * 2);
  for (let b = 0; b < BITS; b++) {
    g.fillStyle = (n >> b) & 1 ? "#fff" : "#000";
    g.fillRect(BAR * (b + 1), BAR / 2, BAR, BAR);
  }
}
window.__render = (n) => render(n);
// Referência exata: o mesmo desenho, no mesmo navegador/GPU/fontes, num canvas à parte.
window.__refFrame = (n) => {
  const rc = document.createElement("canvas");
  rc.width = W;
  rc.height = H;
  render(n, rc.getContext("2d"));
  return rc.toDataURL("image/png");
};
window.__dims = { W, H };
img.onload = () => {
  if (params.has("n")) {
    render(Number(params.get("n")), g0);
    window.__ready = true;
    return;
  }
  const t0 = performance.now();
  let last = -1;
  const loop = () => {
    const n = Math.floor((performance.now() - t0) / (1000 / 30));
    if (n !== last) {
      render(n, g0);
      last = n;
    }
    requestAnimationFrame(loop);
  };
  loop();
  window.__ready = true;
};
</script>
</body>
</html>
